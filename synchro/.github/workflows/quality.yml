name: Code Quality & Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Check typing
      run: npx tsc --noEmit
      
    - name: Run linting
      run: npm run lint
      
    - name: Run Unit Tests
      run: npx vitest run
